<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230AB77F'/><text x='50%' y='68%' font-size='60' font-weight='900' fill='white' text-anchor='middle' font-family='system-ui'>M</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MARS Cashflow</title>
    <meta name="description" content="MARS Cashflow connects landlords, caretakers, and tenants in Uganda with real-time rent ledgers, Google Maps portfolio visualization, and Google Workspace integrations (Drive, Gmail, Calendar, Docs, Sheets, Slides, Forms, Tasks)." />
    <meta property="og:title" content="MARS Cashflow" />
    <meta property="og:description" content="MARS Cashflow connects landlords, caretakers, and tenants in Uganda with real-time rent ledgers, Google Maps portfolio visualization, and Google Workspace integrations (Drive, Gmail, Calendar, Docs, Sheets, Slides, Forms, Tasks)." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mars_theme_mode');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.setProperty('--mars-bg', '#0B120E');
            document.documentElement.style.setProperty('--mars-ink', '#F2F7F4');
            document.documentElement.style.setProperty('--mars-card', '#131F19');
            document.documentElement.style.setProperty('--mars-green', '#10E3A0');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F5F8F6] text-[#17231E] antialiased selection:bg-[#0AB77F] selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
